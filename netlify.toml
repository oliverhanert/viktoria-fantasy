[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/share"
  to = "/.netlify/functions/share"
  status = 200

[[redirects]]
  from = "/api/season"
  to = "/.netlify/functions/season"
  status = 200

[[redirects]]
  from = "/api/admin-login"
  to = "/.netlify/functions/admin-login"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Coach portal pages stay behind Netlify Identity/Basic Auth in production
# Public standings page is open for shared links

[[headers]]
  for = "/standings.html"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
