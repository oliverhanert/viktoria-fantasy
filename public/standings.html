<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ef">
  <meta name="description" content="BK Viktoria Fantasy">
  <title>BK Viktoria Fantasy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/shared.css">
  <link rel="stylesheet" href="/css/standings.css">
  <link rel="icon" href="/images/viktoria-logo.png">
</head>
<body class="page-standings">
  <div class="app">
    <aside class="sidebar" aria-label="Navigation">
      <div class="sidebar__brand">
        <img class="sidebar__crest" src="/images/viktoria-logo.png" alt="">
        <div class="sidebar__brand-text">
          <span class="sidebar__title">Viktoria</span>
          <span class="sidebar__tag">Fantasy</span>
        </div>
      </div>

      <nav class="sidebar__nav" role="tablist" aria-label="Sektioner">
        <button type="button" class="nav__btn is-on" data-tab="fantasy" role="tab" aria-selected="true">
          <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M6 9v10M18 9v10M12 4v16M8 20h8"/></svg>
          <span>Fantasy</span>
        </button>
        <button type="button" class="nav__btn" data-tab="resultater" role="tab" aria-selected="false">
          <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20"/></svg>
          <span>Resultater</span>
        </button>
        <button type="button" class="nav__btn" data-tab="liga" role="tab" aria-selected="false">
          <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M3 3v18h18M7 16l4-4 4 4 5-6"/></svg>
          <span>Liga</span>
        </button>
      </nav>

      <div class="sidebar__foot">
        <a href="/admin.html" class="nav__btn nav__btn--link">
          <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Admin</span>
        </a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar__bar">
          <img class="topbar__crest" src="/images/viktoria-logo.png" alt="">
          <div class="topbar__head">
            <h1 class="topbar__title" id="page-title">Fantasy</h1>
            <p class="topbar__sub" id="sub">Indlæser…</p>
          </div>
          <div class="topbar__end">
            <div class="season-picker" id="standings-period-bar" hidden>
              <select id="sp-period-select" class="season-picker__select" aria-label="Vælg halvsæson"></select>
              <button type="button" id="sp-period-goto-current" class="season-picker__back" hidden title="Gå til aktuel sæson" aria-label="Gå til aktuel sæson">↩</button>
            </div>
          </div>
        </div>
      </header>

      <main class="content">
        <section id="panel-fantasy" class="view is-on" aria-label="Fantasy"></section>
        <section id="panel-resultater" class="view" aria-label="Resultater"></section>
        <section id="panel-liga" class="view" aria-label="Liga"></section>
      </main>

      <footer class="footer">
        <p id="foot">BK Viktoria af 1900</p>
      </footer>
    </div>

    <nav class="mob-nav" role="tablist" aria-label="Menu">
      <button type="button" class="mob-nav__btn is-on" data-tab="fantasy" aria-label="Fantasy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M6 9v10M18 9v10M12 4v16M8 20h8"/></svg>
        <span>Fantasy</span>
      </button>
      <button type="button" class="mob-nav__btn" data-tab="resultater" aria-label="Resultater">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20"/></svg>
        <span>Resultater</span>
      </button>
      <button type="button" class="mob-nav__btn" data-tab="liga" aria-label="Liga">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 3v18h18M7 16l4-4 4 4 5-6"/></svg>
        <span>Liga</span>
      </button>
      <a href="/admin.html" class="mob-nav__btn mob-nav__btn--link" aria-label="Admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Admin</span>
      </a>
    </nav>
  </div>

  <script type="module" src="/js/standings-app.js"></script>
</body>
</html>
